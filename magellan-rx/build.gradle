apply plugin: 'com.android.library'

group = GROUP
version = VERSION_NAME

android {
  compileSdk Versions.compileSdkVersion

  defaultConfig {
    minSdk Versions.minSdkVersion

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  compileOptions {
    setSourceCompatibility(JavaVersion.VERSION_17)
    setTargetCompatibility(JavaVersion.VERSION_17)
  }

  testOptions {
    targetSdk Versions.targetSdkVersion
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  namespace 'com.wealthfront.magellan.rx'

  publishing {
    singleVariant("release")
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  def isUnitTest = name.contains("UnitTest")
  compilerOptions {
    if (!isUnitTest) {
      freeCompilerArgs.set(['-Xexplicit-api=strict', '-Xannotation-default-target=first-only'])
    }
    if (isUnitTest) {
      freeCompilerArgs.add('-Xannotation-default-target=first-only')
    }
    allWarningsAsErrors.set(true)
    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
  }
}

dependencies {
  implementation project(':magellan-legacy')
  implementation project(':magellan-library')

  implementation libs.rxjava
  implementation libs.inject

  testImplementation libs.junit
  testImplementation libs.truth
  testImplementation libs.mockito
}

apply from: rootProject.file('gradle/gradle-mvn-push.gradle')
