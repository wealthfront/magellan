apply plugin: 'com.android.library'

group = GROUP
version = VERSION_NAME

android {
  compileSdk Versions.compileSdkVersion

  resourcePrefix 'magellan_'

  defaultConfig {
    minSdk Versions.minSdkVersion

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  compileOptions {
    setSourceCompatibility(JavaVersion.VERSION_17)
    setTargetCompatibility(JavaVersion.VERSION_17)
  }

  testOptions {
    targetSdk Versions.targetSdkVersion
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  namespace 'com.wealthfront.magellan.legacy'

  publishing {
    singleVariant("release")
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  def isUnitTest = name.contains("UnitTest")
  compilerOptions {
    if (!isUnitTest) {
      freeCompilerArgs.set(['-Xexplicit-api=strict', '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi', '-Xannotation-default-target=first-only'])
    }
    if (isUnitTest) {
      freeCompilerArgs.add('-Xannotation-default-target=first-only')
    }
    allWarningsAsErrors.set(true)
    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
  }
}

dependencies {
  implementation project(':magellan-library')

  implementation libs.appCompat
  implementation libs.inject
  implementation libs.coroutines
  implementation libs.coroutinesAndroid

  testImplementation project(':internal-test-support')
  testImplementation libs.testCore
  testImplementation libs.junit
  testImplementation libs.truth
  testImplementation libs.mockito
  testImplementation libs.robolectric
}

apply from: rootProject.file('gradle/gradle-mvn-push.gradle')
